<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZERO — Evolution of Gaming</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#050505;--fg:#f2f1ed;--muted:#777;--acid:#d9ff45;--violet:#8f63ff;--cyan:#72e8ff}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",Arial,sans-serif;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:none}
#scroll{position:absolute;top:0;left:0;width:1px;height:900vh;pointer-events:none;visibility:hidden;display:block}
#pin{position:fixed;inset:0;overflow:hidden;background:var(--bg);perspective:1500px;pointer-events:auto}
#pin:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 64% 48%,rgba(255,255,255,.065),transparent 25%),radial-gradient(circle at 34% 68%,rgba(143,99,255,.045),transparent 30%),linear-gradient(110deg,#030303,#080808 50%,#020202)}
#pin:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.72) 100%)}
#world{position:absolute;inset:0;transform-style:preserve-3d}
.grid{position:absolute;inset:0;opacity:.35;background:linear-gradient(90deg,transparent 0 49.9%,rgba(255,255,255,.08) 50%,transparent 50.1%),linear-gradient(0deg,transparent 0 49.9%,rgba(255,255,255,.045) 50%,transparent 50.1%);background-size:100% 100%,100% 100%}
.line{position:absolute;height:1px;left:6vw;right:6vw;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}.line.a{top:20%}.line.b{top:80%;opacity:.55}
.frame{position:absolute;inset:12%;border:1px solid rgba(255,255,255,.075);transform:translateZ(-80px)}
.frame:before,.frame:after{content:"";position:absolute;width:52px;height:52px;border-top:1px solid var(--acid);border-left:1px solid var(--acid)}.frame:after{right:0;bottom:0;transform:rotate(180deg)}
#art{position:absolute;inset:0;transform-style:preserve-3d}
.scene{position:absolute;inset:0;opacity:0;transform-style:preserve-3d}
.scene.active{opacity:1}
.center{position:absolute;left:61%;top:50%;transform-style:preserve-3d}
.shadow{position:absolute;left:50%;top:73%;width:540px;height:100px;transform:translate(-50%,-50%) rotateX(74deg);background:#000;filter:blur(30px);opacity:.75}
/* 1972: line-art machine / pixel field */
.pixelMachine{width:520px;height:340px;transform:translate(-50%,-50%) rotateY(-14deg) rotateX(3deg);border:1px solid #3d413c;background:linear-gradient(140deg,#080908,#171916,#070807);box-shadow:35px 35px 0 #030303,0 40px 100px #000}
.pixelMachine:before{content:"";position:absolute;inset:26px;border:1px solid rgba(217,255,69,.2)}
.pixels{position:absolute;left:50%;top:50%;width:245px;height:170px;transform:translate(-50%,-50%) translateZ(45px);display:grid;grid-template-columns:repeat(14,1fr);gap:7px}
.pixels i{width:7px;height:7px;background:var(--acid);opacity:.08;box-shadow:0 0 12px var(--acid)}.pixels i.on{opacity:.95}
/* 1982: orb + typography */
.orb{width:310px;height:310px;transform:translate(-50%,-50%) translateZ(90px);border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff 0 2%,#bfaaff 7%,#8f63ff 22%,#2a145f 48%,#08060e 73%);box-shadow:-35px 25px 80px rgba(143,99,255,.25),inset -35px -20px 60px #000}
.orb:before{content:"";position:absolute;inset:-28px;border:1px solid rgba(217,255,69,.5);border-radius:50%;transform:rotateX(70deg);box-shadow:0 0 35px rgba(217,255,69,.15)}
.orb:after{content:"";position:absolute;inset:22px;border-radius:50%;border:1px solid rgba(255,255,255,.22);transform:rotateY(70deg)}
.ring3{width:500px;height:500px;border:1px solid rgba(255,255,255,.12);border-radius:50%;transform:translate(-50%,-50%) rotateX(72deg) rotateZ(-20deg)}
.ring4{width:410px;height:410px;border:1px solid rgba(143,99,255,.35);border-radius:50%;transform:translate(-50%,-50%) rotateY(70deg)}
/* 1994: console */
.console{width:560px;height:300px;transform:translate(-50%,-50%) rotateY(8deg);background:#0a0b0b;border:1px solid #363939;box-shadow:35px 35px 0 #030303,0 40px 100px #000}
.console:before{content:"";position:absolute;inset:24px;background:linear-gradient(135deg,#081317,#0c0d0e);border:1px solid rgba(114,232,255,.2);box-shadow:inset 0 0 55px rgba(114,232,255,.12)}
.pad{width:330px;height:92px;border-radius:50px;transform:translate(-50%,-50%) translate3d(0,180px,115px) rotateX(12deg);background:linear-gradient(#292b2b,#080909);border:1px solid #414444;box-shadow:0 25px 45px #000}
.pad:before,.pad:after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;top:32px;background:var(--acid);box-shadow:0 0 18px rgba(217,255,69,.4)}.pad:before{left:55px}.pad:after{right:55px;background:var(--violet)}
.consoleRing{width:270px;height:270px;border:1px solid var(--acid);border-radius:50%;transform:translate(-50%,-50%) translateZ(85px) rotateX(67deg);box-shadow:0 0 40px rgba(217,255,69,.18)}
/* 1996: singular faceted object */
.faceted{width:300px;height:300px;transform:translate(-50%,-50%) rotateX(20deg) rotateY(30deg);background:linear-gradient(135deg,#2b2b2b,#0b0b0b 52%,#242424);clip-path:polygon(50% 0,96% 28%,80% 80%,50% 100%,18% 78%,4% 28%);box-shadow:0 0 100px rgba(143,99,255,.22)}
.faceted2{width:440px;height:440px;border:1px solid rgba(217,255,69,.6);border-radius:50%;transform:translate(-50%,-50%) rotateX(72deg);box-shadow:0 0 50px rgba(217,255,69,.1)}
.faceted3{width:520px;height:520px;border:1px solid rgba(114,232,255,.22);border-radius:50%;transform:translate(-50%,-50%) rotateY(66deg)}
/* 2005: connected architecture */
.core{width:100px;height:100px;border-radius:50%;background:#071217;border:1px solid var(--cyan);box-shadow:0 0 70px rgba(114,232,255,.45);transform:translate(-50%,-50%) translateZ(100px)}
.node{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--acid);box-shadow:0 0 25px var(--acid)}
.n1{transform:translate(-50%,-50%) translate3d(-280px,-130px,30px)}.n2{transform:translate(-50%,-50%) translate3d(285px,-120px,10px)}.n3{transform:translate(-50%,-50%) translate3d(-310px,145px,45px)}.n4{transform:translate(-50%,-50%) translate3d(310px,145px,-10px)}.n5{transform:translate(-50%,-50%) translate3d(0,-220px,80px)}.n6{transform:translate(-50%,-50%) translate3d(0,225px,30px)}
.conn{height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);transform-origin:left center;opacity:.55}
.c1{width:340px;transform:translate(-50%,-50%) translate3d(-250px,-110px,40px) rotateZ(20deg)}.c2{width:340px;transform:translate(-50%,-50%) translate3d(75px,-110px,45px) rotateZ(160deg)}.c3{width:370px;transform:translate(-50%,-50%) translate3d(-260px,130px,50px) rotateZ(-23deg)}.c4{width:370px;transform:translate(-50%,-50%) translate3d(80px,130px,20px) rotateZ(203deg)}.c5{width:240px;transform:translate(-50%,-50%) translate3d(-1px,-215px,80px) rotateZ(90deg)}
/* 2015: editorial media wall */
.wallA{width:600px;height:350px;transform:translate(-50%,-50%) rotateY(-7deg);background:#0a0b0b;border:1px solid #353838;box-shadow:35px 35px 0 #030303}
.wallA:before{content:"";position:absolute;inset:22px;background:linear-gradient(120deg,rgba(143,99,255,.22),transparent 43%),linear-gradient(0deg,#101b22,#08090a);border:1px solid rgba(114,232,255,.2)}
.wallB{width:420px;height:250px;transform:translate(-50%,-50%) translate3d(100px,-110px,110px) rotateY(-13deg);background:#0e0f0f;border:1px solid rgba(217,255,69,.45)}
.wallC{width:270px;height:155px;transform:translate(-50%,-50%) translate3d(-170px,120px,135px) rotateY(-18deg);background:#101112;border:1px solid rgba(114,232,255,.4)}
/* Future */
.futureRing{width:650px;height:650px;border:1px solid var(--acid);border-radius:50%;transform:translate(-50%,-50%) rotateX(74deg);box-shadow:0 0 100px rgba(217,255,69,.12),inset 0 0 90px rgba(217,255,69,.04)}
.futureRing2{width:490px;height:490px;border:1px solid rgba(114,232,255,.4);border-radius:50%;transform:translate(-50%,-50%) rotateY(67deg)}
.horizon{width:920px;height:1px;background:linear-gradient(90deg,transparent,var(--acid),transparent);transform:translate(-50%,-50%) translateZ(100px);box-shadow:0 0 35px rgba(217,255,69,.4)}


.onlineAtmosphere{position:absolute;inset:8% 3% 10% 42%;opacity:.06;mix-blend-mode:screen;background:url("https://www.okajeux.com/wp-content/uploads/2024/09/plongee_dans_le_futur__les_jeux_video_high_tech_qui_vont_tout_changer.webp") center/cover no-repeat;filter:grayscale(1) contrast(1.2);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 70%,transparent)}


.imagePlate{backface-visibility:hidden}
.imagePlate img{transition:filter .25s linear}
.arcadePhoto{width:370px;height:460px;transform:translate(-50%,-50%) translate3d(-165px,-15px,90px) rotateY(13deg) rotateZ(-4deg)}
.homePhoto{width:390px;height:250px;transform:translate(-50%,-50%) translate3d(-190px,-145px,125px) rotateY(10deg) rotateZ(-2deg)}
.homePhoto img{object-position:center;filter:saturate(.7) contrast(1.12) brightness(.52)}
.controllerPhoto{width:500px;height:290px;transform:translate(-50%,-50%) translate3d(10px,100px,180px) rotateY(-12deg) rotateX(8deg)}
.pcPhoto{width:540px;height:320px;transform:translate(-50%,-50%) translate3d(115px,-95px,110px) rotateY(-10deg) rotateX(2deg)}
.vrPhoto{width:450px;height:540px;transform:translate(-50%,-50%) translate3d(125px,-10px,105px) rotateY(-12deg) rotateZ(3deg)}

/* image layers: used selectively, not as decoration everywhere */
.imagePlate{position:absolute;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#090909;box-shadow:28px 28px 70px rgba(0,0,0,.65);transform-style:preserve-3d}
.imagePlate img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.8) contrast(1.08) brightness(.62)}
.imagePlate:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(217,255,69,.08),transparent 35%,rgba(0,0,0,.48))}
.arcadePhoto{width:330px;height:440px;transform:translate(-50%,-50%) translate3d(-175px,-20px,55px) rotateY(12deg) rotateZ(-4deg)}
.arcadePhoto img{object-position:58% center}
.controllerPhoto{width:520px;height:300px;overflow:visible;background:transparent;border:0;box-shadow:none;transform:translate(-50%,-50%) translate3d(0,85px,150px) rotateY(-12deg) rotateX(8deg)}
.controllerPhoto img{object-fit:contain;filter:drop-shadow(0 32px 32px rgba(0,0,0,.65)) drop-shadow(0 0 30px rgba(114,232,255,.18));}
.pcPhoto{width:500px;height:300px;transform:translate(-50%,-50%) translate3d(115px,-100px,80px) rotateY(-10deg) rotateX(2deg)}
.pcPhoto img{object-position:center;filter:saturate(.72) contrast(1.12) brightness(.5)}
.vrPhoto{width:420px;height:520px;transform:translate(-50%,-50%) translate3d(120px,-20px,80px) rotateY(-12deg) rotateZ(3deg)}
.vrPhoto img{object-position:center;filter:saturate(.72) contrast(1.1) brightness(.48)}
.photoTag{position:absolute;left:16px;bottom:14px;z-index:2;font:8px "DM Mono";letter-spacing:.16em;color:#ddd;text-transform:uppercase}
.photoTag b{color:var(--acid);font-weight:400}

/* typography choreography */
.copy{position:absolute;left:7.5vw;top:50%;width:47vw;height:55vh;margin-top:-27.5vh;z-index:30;pointer-events:none}
.copyLayer{position:absolute;left:0;top:0;width:100%;opacity:0;filter:none;pointer-events:none;will-change:opacity,left,top}
.copyLayer.active{opacity:1}
.copyLayer.leaving{opacity:0}
.kicker{font:9px "DM Mono",monospace;letter-spacing:.2em;color:var(--acid);margin-bottom:19px}.kicker:before{content:"";display:inline-block;width:21px;height:1px;background:var(--acid);margin-right:11px;vertical-align:middle}
.title{margin:0;font-size:clamp(62px,8.5vw,128px);line-height:.76;letter-spacing:-.09em;font-weight:600;overflow:visible}
.title .word{display:block;white-space:nowrap;transform-origin:left center;will-change:transform,opacity,filter}
.desc{margin-top:28px;font-size:13px;line-height:1.7;color:#b5b5b5;max-width:430px}
.year{position:absolute;right:7vw;top:50%;transform:translateY(-50%);font:clamp(90px,15vw,210px) "DM Mono",monospace;letter-spacing:-.12em;color:rgba(255,255,255,.14);z-index:10}
.timeline{position:absolute;right:29px;top:50%;height:290px;width:1px;background:#252525;z-index:40}.fill{position:absolute;left:-1px;top:0;width:3px;height:0;background:var(--acid);box-shadow:0 0 18px var(--acid)}.dot{position:absolute;left:-4px;top:0;width:9px;height:9px;border-radius:50%;background:var(--acid);box-shadow:0 0 18px var(--acid)}
.years{position:absolute;right:14px;top:-3px;height:296px;display:flex;flex-direction:column;justify-content:space-between;font:10px "DM Mono";color:#888}.years b{color:#eee;font-weight:400}
.top{position:absolute;z-index:60;left:30px;right:30px;top:25px;display:flex;justify-content:space-between;font:10px "DM Mono";letter-spacing:.16em;color:#a0a0a0;text-transform:uppercase}.brand{font:bold 20px "Space Grotesk";color:#eee;letter-spacing:.14em}.top b{font-weight:400;color:#eee}
.bottom{position:absolute;z-index:60;left:30px;right:30px;bottom:25px;display:flex;justify-content:space-between;font:10px "DM Mono";letter-spacing:.16em;color:#999}.bottom b{color:#eee;font-weight:400}
.mode{position:absolute;z-index:60;right:7vw;top:28%;font:10px "DM Mono";letter-spacing:.18em;color:#999}.mode:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acid);box-shadow:0 0 15px var(--acid);margin-right:8px}
/* intro is a composition, not a loading screen */
#intro{position:absolute;z-index:200;inset:0;display:grid;place-items:center;background:#030303;pointer-events:none}
.zero{position:relative;font-size:clamp(110px,20vw,260px);font-weight:700;letter-spacing:-.15em}.zero:before,.zero:after{content:"ZERO";position:absolute;inset:0;font:inherit;letter-spacing:inherit;color:transparent}.zero:before{-webkit-text-stroke:1px rgba(217,255,69,.45);transform:translate(20px,16px)}.zero:after{-webkit-text-stroke:1px rgba(114,232,255,.22);transform:translate(-17px,-13px)}
.introTop{position:absolute;top:15%;font:10px "DM Mono";letter-spacing:.26em;color:#aaa}.introTop b{color:var(--acid);font-weight:400}.introBottom{position:absolute;bottom:14%;font:10px "DM Mono";letter-spacing:.2em;color:#aaa}
@media(max-width:700px){.top{left:16px;right:16px}.top>div:last-child{display:none}.copy{left:7vw;width:78vw;top:45%}.title{font-size:16vw}.year{right:7vw;top:68%;font-size:22vw}.timeline{right:16px}.years{display:none}.center{left:65%}.pixelMachine,.console,.wallA{transform:translate(-50%,-50%) scale(.62)}.orb{transform:translate(-50%,-50%) translateZ(60px) scale(.72)}.ring3{transform:translate(-50%,-50%) rotateX(72deg) scale(.72)}}

/* REAL HTML TEXT: selectable and copyable */
.copy,.copyLayer,.kicker,.title,.title .word,.desc,.year,.years,.years span,.years b,
.top,.bottom,.brand,.mode,.introTop,.introBottom,.zero{
  user-select:text;
  -webkit-user-select:text;
  cursor:text;
}
.copyLayer{pointer-events:auto}
#intro{pointer-events:none}

/* Typography clarity */
body{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
}
.title,.kicker,.desc,.year,.years,.top,.bottom,.mode,.introTop,.introBottom,.zero{
  text-rendering:geometricPrecision;
}

/* Final crisp text + smooth scroll */
.copy,.copyLayer,.year,.timeline,.top,.bottom,.mode{transform-style:flat !important;backface-visibility:visible !important;-webkit-backface-visibility:visible !important;}
.copy,.copyLayer{will-change:opacity,left,top;}
.title,.kicker,.desc,.year,.years,.top,.bottom,.mode{filter:none !important;text-rendering:geometricPrecision;}
</style>
</head>
<body>
<div id="pin">
 <div id="world">
  <div class="grid"></div><div class="line a"></div><div class="line b"></div><div class="frame"></div>
  <div id="art">
   <section class="scene" id="s0"><div class="shadow"></div><div class="center"><div class="pixelMachine"></div><div class="pixels" id="pixelGrid"></div></div></section>
   <section class="scene" id="s1"><div class="shadow"></div><div class="center"><div class="ring3"></div><div class="ring4"></div><div class="orb"></div><div class="imagePlate arcadePhoto"><img src="assets/so-many-classics.jpg" alt="Retro arcade machines"><div class="photoTag"><b>01</b> / ARCADE MEMORY</div></div></div></section>
   <section class="scene" id="s2"><div class="shadow"></div><div class="center"><div class="console"></div><div class="consoleRing"></div><div class="pad"></div><div class="imagePlate homePhoto"><img src="assets/2166077-gaming-1582884808.jpg" alt="Home gaming with a controller"><div class="photoTag"><b>02</b> / GAMING MOVES HOME</div></div><div class="imagePlate controllerPhoto"><img src="assets/controller-cutout.png" alt="Futuristic gaming controller"><div class="photoTag"><b>03</b> / INPUT EVOLVES</div></div></div></section>
   <section class="scene" id="s3"><div class="shadow"></div><div class="center"><div class="faceted3"></div><div class="faceted2"></div><div class="faceted"></div></div></section>
   <section class="scene" id="s4"><div class="shadow"></div><div class="center"><div class="core"></div><div class="node n1"></div><div class="node n2"></div><div class="node n3"></div><div class="node n4"></div><div class="node n5"></div><div class="node n6"></div><div class="conn c1"></div><div class="conn c2"></div><div class="conn c3"></div><div class="conn c4"></div><div class="conn c5"></div></div></section>
   <section class="scene" id="s5"><div class="shadow"></div><div class="center"><div class="wallA"></div><div class="wallB"></div><div class="wallC"></div></div></section>
   <section class="scene" id="s6"><div class="center"><div class="futureRing"></div><div class="futureRing2"></div><div class="horizon"></div></div></section>
  </div>

 </div>
  <div class="copy">
  <div class="copyLayer active" id="copyA"><div class="kicker"></div><h1 class="title"></h1><div class="desc"></div></div>
  <div class="copyLayer" id="copyB"><div class="kicker"></div><h1 class="title"></h1><div class="desc"></div></div>
</div>
  <div id="year" class="year">1972</div><div class="mode">SCROLL / EVOLVE</div>
  <div class="timeline"><div id="fill" class="fill"></div><div id="dot" class="dot"></div><div class="years" aria-label="Timeline years">
      <b>1972</b><span>1982</span><span>1994</span><span>1996</span>
      <span>2005</span><span>2015</span><b>∞</b>
    </div></div>
  <div class="top"><div class="brand">ZERO</div><div><b>THE EVOLUTION OF GAMING</b> &nbsp; / &nbsp; INTERACTIVE ARCHIVE 01</div></div>
  <div class="bottom"><div>PROGRESS <b id="pct">00</b>%</div><div>CHAPTER <b id="chapter">01 / 07</b></div></div>
  <div id="intro" aria-label="Introduction">
      <div class="introTop"><b>000</b> / A VISUAL HISTORY OF PLAY</div>
      <div class="zero" aria-label="ZERO">ZERO</div>
      <div class="introBottom">SCROLL TO ENTER</div>
    </div>
</div>
<div id="scroll"></div>
<noscript>
  <div style="position:fixed;inset:0;background:#050505;color:#f2f1ed;padding:40px;font-family:Arial,sans-serif;z-index:9999">
    <h1>ZERO — A VISUAL HISTORY OF PLAY</h1>
    <p>1972 — THE BEGINNING · 1982 — ARCADE AGE · 1994 — GAMING AT HOME ·
    1996 — THE 3D REVOLUTION · 2005 — CONNECTED WORLDS ·
    2015 — MODERN GAMING · THE FUTURE</p>
  </div>
</noscript>
<script>
(()=> {
const $=id=>document.getElementById(id);
const data=[
["1972 — THE BEGINNING",["THE","BEGINNING"],"A few pixels were enough to start an industry. The first worlds were small. The idea was enormous."],
["1982 — ARCADE AGE",["ARCADE","AGE"],"The machine became a destination. Light, sound and competition turned a room into a ritual."],
["1994 — HOME GAMING",["GAMING","AT","HOME"],"The arcade came home. A controller became a key — and the living room became a new kind of world."],
["1996 — THE 3D REVOLUTION",["THE","3D","REVOLUTION"],"Depth changed the language of play. Geometry became space, and space became something you could explore."],
["2005 — CONNECTED WORLDS",["CONNECTED","WORLDS"],"The screen stopped being a boundary. Networks turned separate players into one persistent world."],
["2015 — MODERN GAMING",["WORLDS","WITHOUT","LIMITS"],"Scale exploded. Games became cinematic, social and persistent — worlds that continued when you left."],
["THE FUTURE",["THE","BOUNDARY","DISAPPEARS"],"The next interface may not look like a game at all. The evolution continues beyond the screen."]
];
const years=[1972,1982,1994,1996,2005,2015,2026];
let target=0,p=0,lastIndex=-1;
function syncScrollHeight(){
  document.body.style.minHeight = "900vh";
  document.documentElement.style.overflowY = "auto";
  document.body.style.overflowY = "visible";
}
function scroll(){
  const max=Math.max(1,Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)-innerHeight);
  target=Math.max(0,Math.min(1,window.scrollY/max));
}
syncScrollHeight();
addEventListener("scroll",scroll,{passive:true});
addEventListener("resize",scroll);
scroll();

let activeLayer=0;
let pairKey="";
function smoothstep(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
function fillLayer(layer,i){
 const k=layer.querySelector(".kicker"), title=layer.querySelector(".title"), desc=layer.querySelector(".desc");
 k.textContent=data[i][0];
 desc.textContent=data[i][2];
 title.innerHTML="";
 data[i][1].forEach(w=>{
   let s=document.createElement("span");
   s.className="word";
   s.textContent=w;
   title.appendChild(s);
 });
}
function ensurePair(i,next){
 const key=i+"-"+next;
 if(key===pairKey)return;
 pairKey=key;
 fillLayer($("copyA"),i);
 fillLayer($("copyB"),next);
 $("chapter").textContent=String(i+1).padStart(2,"0")+" / 07";
}

function render(t){
 requestAnimationFrame(render);
 p+=(target-p)*.075;
 const raw=p*6;
 const idx=Math.min(6,Math.floor(raw));
 const local=raw-idx;
 const next=Math.min(6,idx+1);
 ensurePair(idx,next);

 const introFade=Math.max(0,Math.min(1,p*11));
 $("intro").style.opacity=1-introFade;
 $("intro").style.transform=`translate3d(0,${-p*40}px,0) scale(${1-p*.04})`;

 $("year").textContent=idx===6?"∞":Math.round(years[idx]+(years[idx+1]-years[idx])*(local*local*(3-2*local)));
 $("pct").textContent=String(Math.round(p*100)).padStart(2,"0");
 $("fill").style.height=(p*100)+"%";
 $("dot").style.top=(p*100)+"%";

 for(let i=0;i<7;i++){
   let d=raw-i;
   let focus=Math.max(0,1-Math.abs(d));
   let enter=Math.max(0,Math.min(1,d+1));
   const sc=$("s"+i);
   sc.style.opacity=focus;
   sc.style.visibility=focus>.001?"visible":"hidden";
   const z=(1-enter)*-360;
   const y=(1-enter)*34;
   const scale=.74+.26*enter;
   const rot=(1-enter)*-7;
   sc.style.transform=`translate3d(0,${y}vh,${z}px) scale(${scale}) rotateY(${rot}deg)`;
   const center=sc.querySelector(".center");
   if(center) center.style.transform=`translateX(${Math.sin((i+1)*1.7)*local*1.4}vw) translateY(${Math.cos((i+1)*1.3)*local*1.1}vh)`;
 }

 // Continuous crossfade: the left copy does NOT change suddenly at an era boundary.
 const fade=smoothstep((local-.22)/.56);
 const A=$("copyA"), B=$("copyB");
 A.style.opacity=1-fade;
 B.style.opacity=fade;
 A.style.filter="none";
 B.style.filter="none";
 A.style.left=(-42*fade)+"px";
 A.style.top=(-8*fade)+"px";
 B.style.left=(42*(1-fade))+"px";
 B.style.top=(8*(1-fade))+"px";

 const visibleLayer=fade<.5?A:B;
 [...visibleLayer.querySelectorAll(".word")].forEach((w,i)=>{
   const stagger=i*.035;
   const localFade=fade<.5 ? Math.max(0,1-(fade+stagger)*1.55) : Math.max(0,(fade-stagger)*1.55);
   w.style.opacity=String(.78+.22*localFade);
 });

 $("world").style.transform=`translate3d(${(p-.5)*1.2}vw,${Math.sin(p*6.28)*.35}vh,${p*80}px) rotateY(${(p-.5)*1.4}deg)`;
